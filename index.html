<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Productos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons for modern retail feel -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    font-family: 'Inter', sans-serif;
    html { scroll-behavior: smooth; }
  </style>
</head>
<body class="bg-slate-950 text-gray-100 p-2 sm:p-4 md:p-8 min-h-screen">

  <!-- Script con el número de teléfono centralizado para WhatsApp -->
  <script>
    // ⚠️ REEMPLAZA ESTE NÚMERO POR TU NÚMERO REAL DE WHATSAPP CON CÓDIGO DE PAÍS (Sin el signo + ni espacios)
    // Ejemplo para Venezuela (58): '584121234567'
    const MI_TELEFONO_WHATSAPP = '584120000000'; 

    function sendWhatsApp(productTitle, size, price) {
      const mensaje = `Hola! Me interesa comprar este producto de tu catálogo:\n\n📌 *${productTitle}*\n📏 *Talla:* ${size}\n💵 *Precio:* ${price}\n\n¿Aún lo tienes disponible?`;
      const encodedMsg = encodeURIComponent(mensaje);
      window.open(`https://wa.me/${MI_TELEFONO_WHATSAPP}?text=${encodedMsg}`, '_blank');
    }
  </script>

  <!-- Modal para ver imagen ampliada -->
  <div id="image-modal" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-md hidden flex items-center justify-center p-4 transition-all duration-300" onclick="closeModal()">
    <div class="relative max-w-4xl w-full max-h-[90vh] flex flex-col items-center justify-center" onclick="event.stopPropagation()">
      <button onclick="closeModal()" class="absolute -top-12 right-0 text-white hover:text-amber-400 font-bold text-xl flex items-center gap-2 bg-slate-800/90 px-4 py-2 rounded-full border border-slate-700 transition-colors cursor-pointer shadow-lg">
        <span>Cerrar</span>
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
      <img id="modal-img" src="" alt="Imagen ampliada" class="max-w-full max-h-[80vh] object-contain rounded-2xl shadow-2xl border border-slate-700 select-none" />
      <div id="modal-caption" class="text-white text-center font-bold mt-4 text-base md:text-lg bg-slate-900/90 px-6 py-2.5 rounded-full border border-slate-800 shadow-xl flex items-center gap-3"></div>
    </div>
  </div>

  <div class="w-full max-w-6xl mx-auto bg-slate-900 shadow-2xl rounded-3xl overflow-hidden border border-slate-800">
    <!-- Header llamativo con efecto gradiente y badge dinámico -->
    <header class="relative bg-gradient-to-r from-slate-900 via-slate-800 to-amber-950 text-white text-center p-6 md:p-10 border-b border-slate-800 overflow-hidden">
      <div class="absolute -top-12 -right-12 w-48 h-48 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute -bottom-12 -left-12 w-48 h-48 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>
      
      <span class="inline-flex items-center gap-2 px-4 py-1.5 bg-amber-500/20 text-amber-400 font-bold rounded-full text-xs uppercase tracking-widest border border-amber-500/30 mb-3 shadow-sm">
        <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
        Colección Exclusiva • Envíos e Importaciones
      </span>
      <h1 class="text-3xl sm:text-4xl md:text-5xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-100 to-amber-300">
        CATÁLOGO DE PRODUCTOS
      </h1>
      <p class="text-slate-400 text-sm md:text-base mt-2 max-w-2xl mx-auto">
        Ropa Exclusiva 100% Nueva y Original • Garantía de Autenticidad
      </p>

      <!-- Buscador y Filtros interactivos -->
      <div class="mt-6 max-w-xl mx-auto flex flex-col sm:flex-row gap-3">
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input type="text" id="search-input" onkeyup="filterProducts()" placeholder="Buscar prenda (ej: RVCA, Shorts, Verde)..." class="w-full pl-10 pr-4 py-2.5 bg-slate-950/80 border border-slate-700/80 rounded-xl text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-amber-500 transition-colors shadow-inner" />
        </div>
        <select id="category-filter" onchange="filterProducts()" class="px-4 py-2.5 bg-slate-950/80 border border-slate-700/80 rounded-xl text-sm text-slate-300 font-semibold focus:outline-none focus:border-amber-500 cursor-pointer">
          <option
